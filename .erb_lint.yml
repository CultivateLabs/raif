---
EnableDefaultLinters: true
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'
  # Not a view: the eval comparison report is a standalone HTML file written by
  # `raif evals:compare` for the developer who ran it. It is never rendered in a request, so
  # HardCodedString would have us translate a CLI artifact, and RequireScriptNonce has no CSP
  # to satisfy. Its multi-line <% %> header also reads as Layout/LeadingEmptyLines.
  #
  # No trailing /* on the glob: erb_lint expands these to absolute paths and matches with a
  # flagless File.fnmatch?, where '**/*' still requires a literal slash after the directory
  # and so misses files sitting directly in it.
  - 'lib/raif/evals/**'
linters:
  RequireScriptNonce:
    enabled: true
  ErbSafety:
    enabled: true
    # better_html_config: .better-html.yml
  HardCodedString:
    enabled: true
  StrictLocals:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false