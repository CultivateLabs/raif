---
EnableDefaultLinters: true
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'
  # The eval comparison report is not a view - it is a standalone HTML file `raif
  # evals:compare` writes for the developer who ran it, never rendered in a request. So
  # HardCodedString would have us translate a CLI artifact and RequireScriptNonce has no CSP
  # to satisfy.
  #
  # No trailing /* on the glob: erb_lint matches with a flagless File.fnmatch?, where '**/*'
  # requires a literal slash after the directory and so misses files sitting directly in it.
  - 'lib/raif/evals/**'
linters:
  RequireScriptNonce:
    enabled: true
  ErbSafety:
    enabled: true
    # better_html_config: .better-html.yml
  HardCodedString:
    enabled: true
  StrictLocals:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false