---
EnableDefaultLinters: true
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'
  # The eval comparison report is a standalone HTML file `raif evals:compare` writes for the
  # developer who ran it, never rendered in a request: HardCodedString would have us translate a
  # CLI artifact, and RequireScriptNonce has no CSP to satisfy. Named rather than globbed, so an
  # ERB added next to it later is still linted.
  - 'lib/raif/evals/comparison_report.html.erb'
linters:
  RequireScriptNonce:
    enabled: true
  ErbSafety:
    enabled: true
    # better_html_config: .better-html.yml
  HardCodedString:
    enabled: true
  StrictLocals:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false