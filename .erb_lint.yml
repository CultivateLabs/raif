---
EnableDefaultLinters: true
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'
  # The eval comparison report is not a view - it is a standalone HTML file `raif
  # evals:compare` writes for the developer who ran it, never rendered in a request. So
  # HardCodedString would have us translate a CLI artifact and RequireScriptNonce has no CSP
  # to satisfy. Named rather than globbed by directory, so an ERB added next to it later is
  # still linted. (Were a glob ever wanted here, note that erb_lint matches with a flagless
  # File.fnmatch?, where '**/*' requires a literal slash and so misses files sitting directly
  # in the directory.)
  - 'lib/raif/evals/comparison_report.html.erb'
linters:
  RequireScriptNonce:
    enabled: true
  ErbSafety:
    enabled: true
    # better_html_config: .better-html.yml
  HardCodedString:
    enabled: true
  StrictLocals:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false