---
EnableDefaultLinters: true
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'
  # The eval reports are standalone HTML files `raif evals:compare` and `raif evals:report` write
  # for the developer who ran them, never rendered in a request: HardCodedString would have us
  # translate a CLI artifact, and RequireScriptNonce has no CSP to satisfy. Named rather than
  # globbed, so an ERB added next to them later is still linted.
  - 'lib/raif/evals/comparison_report.html.erb'
  - 'lib/raif/evals/run_report.html.erb'
linters:
  RequireScriptNonce:
    enabled: true
  ErbSafety:
    enabled: true
    # better_html_config: .better-html.yml
  HardCodedString:
    enabled: true
  StrictLocals:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false